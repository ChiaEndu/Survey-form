<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free CodeCamp survey Form</title>
</head>
<body>
      <header>
            <h1>freeCodeCamp Survey Form</h1>
            <p id="p1">Thank you for taking the time to help us improve the platform</p>
        </header>
        <main>
            <form action="submit-data" method="POST">
                <link rel="stylesheet" href="styles/style.css">
                <div>
                <label>Name</label><br>
                <input type="text" placeholder="Enter your Name" class="fit"/><br><br>
                <label>Email</label><br> 
                <input type="email" placeholder="Enter your Email" class="fit"/><br><br>
                <label>Age (optional)</label><br>
                <input type="number" placeholder="Age" class="fit"/><br><br>
                <label>Which option best describes your current role</label><br><br>
                <select class="op">
                    <option value="" disabled selected>select a role</option>
                    <option>student</option>
                    <option >Full Time Job</option>
                    <option>Full Time Learner</option>
                    <option>prefer not to say</option>
                    <option>Other</option>
                </select>
                <p>Would you recommend FreeCodeCamp to a friend?</p>
                <input type="radio" id="option1" name="choice"/>
                <label for="option1">Definitely</label><br>
                <input type="radio" id="option2"name="choice" />
                <label for="option2">maybe</label><br>
                <input type="radio" id="option3"name="choice" />
                <label for="option3">not sure</label><br>
                <label>what is your favorite feature of FreeCodeCamp</label><br><br>
                <select class="op">
                    <option value="" disabled selected>select an option</option>
                    <option value="BR">Challenges</option>
                    <option value="CL">projects</option>
                    <option>community</option>
                    <option>Open source</option>
                </select>
                <p>what would you like to see improved? (check all that apply)</p>
                <input type="checkbox" id="front end projects"/>
                <label for="front end projects"> front end projects</label><br>
                <input type="checkbox" id="Back-end projects">
                <label for="Back-end projects">Back-end projects</label><br>
                <input type="checkbox" id="Data visualisation"/>
                <label for="Data visualisation">Data visualisation</label><br>
                <input type="checkbox" id="Challenges"/>
                <label for="Challenges">Challenges</label><br>
                <input type="checkbox" id="Open source community"/>
                <label for="Open source community">Open source community</label><br>
                <input type="checkbox" id="Gitter help rooms"/>
                <label for="Gitter help rooms">Gitter help rooms</label><br>
                <input type="checkbox" id="videos"/>
                <label for="videos">videos</label><br>
                <input type="checkbox" id="City meetups"/>
                <label for="City meetups">City meetups</label><br>
                <input type="checkbox" id="Wiki"/>
                <label for="Wiki">Wiki</label><br>
                <input  type="checkbox" id="Forum"/>
                <label for="Forum">Forum</label><br>
                <input type="checkbox" id="additional courses"/>
                <label for="additional courses">additional courses</label><br><br>
                <p>Any comments or suggestions?</p>
                <textarea id="msg" name="message" placeholder="Enter your comment here"></textarea><br><br>
                <button>summit</button>
                </div>
         </form>
        </main>
</body>
</html>
